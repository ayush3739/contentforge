name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-validate:
    name: Lint & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Environment Template Integrity
        run: |
          test -f .env.example || (echo ".env.example is missing!" && exit 1)

      - name: Verify Documentation & Contracts
        run: |
          test -f documents/00_TEAM_INTEGRATION_CONTRACT.md || (echo "Contract is missing!" && exit 1)
          echo "Documentation verification passed."

      - name: Validate docker-compose.yml
        run: |
          docker compose config -q
          echo "docker-compose.yml is valid."

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Verify .env is not tracked
        run: |
          if git ls-files | grep -qx '.env'; then
            echo ".env must never be committed!" && exit 1
          fi
          echo ".env correctly untracked."

  p5-tests:
    name: P5 Infrastructure Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run P5 tests
        run: |
          if [ -d tests/p5 ]; then
            pytest tests/p5 -v
          else
            echo "No tests/p5 directory yet — skipping."
          fi

      # Dependency scanning placeholder: once backend/requirements.txt and
      # frontend/package.json exist, add pip-audit / npm audit steps here.
      # Intentionally not added yet since those files don't exist in the
      # repository skeleton (would fail with nothing to scan).
