name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-validate:
    name: Lint & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Environment Template Integrity
        run: |
          test -f .env.example || (echo ".env.example is missing!" && exit 1)

      - name: Verify Documentation & Contracts
        run: |
          test -f documents/00_TEAM_INTEGRATION_CONTRACT.md || (echo "Contract is missing!" && exit 1)
          echo "Documentation verification passed."
