<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Main Outer C-Curve Gradient -->
    <linearGradient id="cOuterGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Deep Ambient Blue Shadow -->
    <linearGradient id="deepFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Central Document Gradient -->
    <linearGradient id="docGrad" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Document Lines Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Digital Pixels Gradient 1 -->
    <linearGradient id="pixelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Digital Pixels Gradient 2 -->
    <linearGradient id="pixelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Stylized "C" Arc (Smooth Curving Form) -->
  <g filter="url(#softShadow)">
    <!-- Back Arch of the C -->
    <path
      d="M 330 65 
         C 180 65, 90 150, 90 260 
         C 90 370, 180 440, 310 440 
         C 200 420, 150 340, 150 260 
         C 150 170, 220 110, 330 110 
         Z"
      fill="url(#cOuterGrad)"
    />

    <!-- Lower Wave/Swoosh of the C -->
    <path
      d="M 95 270 
         C 95 385, 185 440, 310 440 
         C 230 435, 175 365, 205 295 
         C 220 260, 160 250, 95 270 
         Z"
      fill="url(#deepFold)"
    />

    <!-- Top Flow Bar -->
    <path
      d="M 230 65 
         L 350 65 
         C 370 65, 385 80, 370 95 
         L 310 115 
         L 230 115 
         Z"
      fill="#e0f2fe"
      opacity="0.8"
    />

    <!-- Central Document Canvas -->
    <path
      d="M 205 140 
         L 310 140 
         C 335 140, 355 160, 355 185 
         L 355 380 
         C 355 400, 335 415, 315 415 
         L 205 415 
         C 185 415, 170 400, 170 380 
         L 170 175 
         C 170 155, 185 140, 205 140 
         Z"
      fill="url(#docGrad)"
    />

    <!-- Document Fold Corner Cut Accent -->
    <path
      d="M 315 140 
         L 355 180 
         L 325 180 
         C 315 180, 315 170, 315 160 
         Z"
      fill="#bae6fd"
    />

    <!-- Horizontal Document Text/Fact Lines -->
    <rect x="220" y="200" width="80" height="14" rx="7" fill="url(#lineGrad)" />
    <rect x="220" y="235" width="95" height="14" rx="7" fill="url(#lineGrad)" />
    <rect x="220" y="270" width="85" height="14" rx="7" fill="url(#lineGrad)" />
    <rect x="220" y="305" width="60" height="14" rx="7" fill="url(#lineGrad)" />

    <!-- Digital Transformation Pixel Elements (Floating to the right) -->
    <!-- Pixel 1 (Top Blue) -->
    <rect x="390" y="90" width="38" height="38" rx="8" fill="url(#pixelGrad1)" />
    <!-- Pixel 2 (Cyan Middle) -->
    <rect x="425" y="140" width="22" height="22" rx="5" fill="#38bdf8" />
    <!-- Pixel 3 (Large Cyan Middle) -->
    <rect x="390" y="175" width="40" height="40" rx="8" fill="url(#pixelGrad1)" />
    <!-- Pixel 4 (Deep Royal Blue) -->
    <rect x="355" y="220" width="40" height="40" rx="8" fill="url(#pixelGrad2)" />
    <!-- Pixel 5 (Small Accent) -->
    <rect x="390" y="255" width="16" height="16" rx="4" fill="#0284c7" />
    <!-- Pixel 6 (Subtle Tinted Ghost) -->
    <rect x="355" y="140" width="30" height="30" rx="6" fill="#bae6fd" opacity="0.6" />
    <!-- Pixel 7 (Bottom Outline) -->
    <rect x="357" y="280" width="24" height="24" rx="5" fill="none" stroke="#bae6fd" stroke-width="3" />
  </g>
</svg>
