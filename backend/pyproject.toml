[project]
name = "backend"
version = "0.1.0"
description = "ContentForge AI - FastAPI Core Backend, AI Engine & Renderers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pgvector>=0.3.5",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.29.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "redis>=8.1.0",
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "sentence-transformers>=6.0.1",
    "pypdf>=6.16.2",
    "reportlab>=5.0.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8.0",
    "email-validator>=2.3.0",
    "python-pptx>=1.0.2",
    "rq>=2.12.0",
    "upstash-redis>=1.8.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
